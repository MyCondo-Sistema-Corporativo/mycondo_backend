services:
  postgres:
    image: postgres:17
    container_name: mycondo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mycondo_user
      POSTGRES_PASSWORD: mycondo_dev_password
      POSTGRES_DB: mycondo_db
    ports:
      - "5432:5432"
    volumes:
      - mycondo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycondo_user -d mycondo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mycondo_postgres_data: